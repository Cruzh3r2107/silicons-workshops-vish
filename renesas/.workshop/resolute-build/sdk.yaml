name: resolute-build
version: "0.1"
title: Renesas Kernel Build Host SDK (Ubuntu 26.04 Resolute)
summary: Build-host provisioning for the Renesas Silicon Workshop on Ubuntu 26.04 (snapcraft edge)
description: |
  Provisions the Renesas build host on Ubuntu 26.04 Resolute: snapcraft
  (latest/edge), arm64 (Cortex-A55) and armhf (Cortex-R52) foreign
  architectures and cross-toolchains, kernel/BSP build dependencies, and qemu
  binfmt for the initrd part's foreign-arch chroot.

  This is a build-host provisioning SDK (hooks only) — it is NOT one of the
  three functional SDKs. The functional SDKs are kernel-sdk, deb-sdk and
  snap-sdk. Pairs with .workshop/renesas-resolute.yaml.
license: GPL-2.0-only

plugs:
  ssh-agent:
    interface: ssh-agent
  build-cache:
    interface: mount
    workshop-target: /var/cache/kernel-build
