# Renesas Silicon Workshop — declarative project configuration
#
# This is the customization API for the workshop (SILICON_WORKSHOP_CONTRACT.md
# §2.4 / §4). It describes *what* to build. The SDK scripts under sdk/ define
# *how* it is built. A future BSP agent specializes this file, not the scripts.
#
# The checked-in defaults describe the reference Renesas RZ/T2H EVK and must
# build without any agent customization.
#
# IMPORTANT: no credentials or per-developer identity live here. Private-repo
# / PPA / token authentication is supplied at runtime through config/board.env
# (gitignored) — see config/board.env.example. This satisfies the contract's
# credentials rule (§14): credentials are never committed to configuration.

schema_version: 1

silicon:
  vendor: renesas
  # SoC family. Supported reference boards: rzt2h (default), rzn2h.
  soc: rzt2h
  board: rzt2h-evk

ubuntu:
  # Ubuntu release the kernel targets. The workshop ships two build
  # environments selected by which .workshop definition you launch:
  #   renesas-noble    → noble    (24.04)
  #   renesas-resolute → resolute (26.04)
  # Keep this in sync with the launched workshop.
  release: resolute
  # Ubuntu Core kernel-snap base folder used by the (out-of-scope) gadget
  # command and the snap build: core24 or core26.
  core_base: core26

kernel:
  # Kernel source repository. Accepts any git URL:
  #   Private Launchpad:  git+ssh://git.launchpad.net/~team/project/+git/repo
  #   Public Launchpad:   https://git.launchpad.net/~team/project/+git/repo
  #   GitHub / other:     https://github.com/org/repo
  # Authentication for private repositories is supplied at runtime via
  # config/board.env (LAUNCHPAD_USER + ssh-agent), never here.
  repository: https://git.launchpad.net/~canonical-kernel/ubuntu/+source/linux-renesas/+git/resolute
  ref:
    type: branch          # branch | tag | commit
    value: main-next
  # Ubuntu kernel config flavour (debian/scripts/misc/annotations --flavour).
  # Confirm against debian/debian.env in the cloned tree.
  config:
    type: flavour
    value: renesas
  # Device trees to validate/stage. Leave empty to stage every DTB the tree
  # produces for the target arch.
  device_trees: []

toolchain:
  # Target architecture: arm64 (Cortex-A55) or armhf (Cortex-R52).
  arch: arm64
  # Cross-compile prefix. Leave empty to auto-derive from arch on an amd64
  # host (arm64 → aarch64-linux-gnu-, armhf → arm-linux-gnueabihf-).
  cross_compile: ""

# Additional local APT archives / PPAs the build needs. Tokens for private
# PPAs are supplied at runtime via config/board.env, not listed here.
archives:
  ppas: []

# Kernel patches applied after checkout, before configure (paths relative to
# the workshop root). Empty for the reference EVK.
patches: []

# Out-of-tree driver integration. Empty for the reference EVK.
drivers:
  out_of_tree: []
